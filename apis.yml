aid: andes
name: Andes
description: 'Andes (Andes Ag, Inc.) is a climate-technology and agricultural-biotechnology
  company founded in 2018 and headquartered in Alameda, California. Andes engineers
  and selects beneficial soil microorganisms that are applied alongside seed in commodity
  row-crop production — corn, soybean, wheat and canola — where they accelerate the
  natural conversion of atmospheric carbon dioxide into stable soil inorganic carbon
  (carbonate minerals), a process the company calls Microbial Carbon Mineralization.
  Andes sells the resulting durable carbon dioxide removal as verified credits to corporate
  buyers and Scope 3 programs, and pays participating growers through the Andes Carbon
  Program. The company published the first Microbial Carbon Mineralization methodology,
  developed with EcoEngineers under ISO 14064, and has run field trials with Bayer,
  Cargill, Corteva, Nutrien and Wilbur-Ellis. Andes has raised roughly $38M, including
  a Series A co-led by Leaps by Bayer and Cavallo Ventures, and its shares trade on
  private secondary venues including EquityZen and Nasdaq Private Market. Andes publishes
  no public API, developer portal, SDK or machine-readable specification.'
